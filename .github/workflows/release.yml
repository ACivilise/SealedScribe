# Release Windows de SealedScribe, construite sur les machines de GitHub.
#
# Tag vX.Y.Z (poussé par la skill /release) : build, signature Windows par SignPath Foundation
# (quand elle est configurée), signature de mise à jour, puis GitHub Release avec l'installeur et
# latest.json (lu par la mise à jour automatique des versions installées).
# Lancement manuel (Actions > Release > Run workflow) : même build, sans publication ; l'installeur
# reste dans les artefacts du run.
#
# Réglages du dépôt (Settings > Secrets and variables > Actions) :
# - secret TAURI_SIGNING_PRIVATE_KEY : contenu de la clé privée de mise à jour (sans mot de passe) ;
# - pour SignPath (voir .signpath/README.md) : variables SIGNPATH_ORGANIZATION_ID,
#   SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG et secret SIGNPATH_API_TOKEN. Tant que
#   SIGNPATH_ORGANIZATION_ID est vide, les étapes de signature Windows sont sautées.
#
# Pas de cache (npm, cargo) : SignPath exige un build vérifiable, sans réutiliser de fichiers
# produits ailleurs. Actions tierces épinglées par commit.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # publication de la release
  actions: read # SignPath vérifie le run et télécharge l'artefact à signer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Lire la version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $VERSION de package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "installer=SealedScribe_${VERSION}_x64-setup.exe" >> "$GITHUB_OUTPUT"

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: |
          npm test
          npx tsc --noEmit

      # Sans empaquetage : l'exe doit être signé avant d'être mis dans l'installeur.
      - name: Construire l'application
        run: npx tauri build --no-bundle --ci -- --locked

      - name: Envoyer l'exe à signer
        id: unsigned-app
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: src-tauri/target/release/meetscribe.exe
          if-no-files-found: error
          retention-days: 7

      # Attend l'approbation de la demande sur le site de SignPath.
      - name: Signer l'exe (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Remplacer l'exe par l'exe signé
        if: env.SIGNPATH_ENABLED == 'true'
        run: cp signed-app/meetscribe.exe src-tauri/target/release/meetscribe.exe

      # `--no-binary-patching` : Tauri ne retouche pas l'exe (sa signature resterait invalide).
      # Le module de mise à jour reconnaît l'installeur NSIS à son contenu. La signature de mise à
      # jour est faite plus bas, après la signature Windows de l'installeur.
      - name: Construire l'installeur
        run: npx tauri bundle --bundles nsis --no-binary-patching --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Envoyer l'installeur à signer
        id: unsigned-installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: src-tauri/target/release/bundle/nsis/${{ steps.version.outputs.installer }}
          if-no-files-found: error
          retention-days: 7

      - name: Signer l'installeur (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Remplacer l'installeur par l'installeur signé
        if: env.SIGNPATH_ENABLED == 'true'
        run: cp "signed-installer/${{ steps.version.outputs.installer }}" "src-tauri/target/release/bundle/nsis/${{ steps.version.outputs.installer }}"

      # ASCII uniquement dans ce bloc PowerShell (regles du poste de l'auteur).
      - name: Vérifier les signatures Windows
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          INSTALLER: src-tauri/target/release/bundle/nsis/${{ steps.version.outputs.installer }}
        run: |
          $files = @('src-tauri/target/release/meetscribe.exe', $env:INSTALLER)
          foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature -FilePath $file
              Write-Output "$file : $($signature.Status) - $($signature.SignerCertificate.Subject)"
              if ($signature.Status -ne 'Valid') {
                  exit 1
              }
          }

      # Comme `tauri build`, la signature porte la version (vérifiée par le module de mise à jour).
      - name: Signer pour la mise à jour automatique
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: src-tauri/target/release/bundle/nsis/${{ steps.version.outputs.installer }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent : les versions installées refuseraient cette mise à jour."
              exit 1
            fi
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY absent : installeur sans signature de mise à jour."
            exit 0
          fi
          npx tauri signer sign --password "" --app-version "$VERSION" "$INSTALLER"
          test -s "$INSTALLER.sig"

      - name: Garder l'installeur dans les artefacts du run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SealedScribe-${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/${{ steps.version.outputs.installer }}
            src-tauri/target/release/bundle/nsis/${{ steps.version.outputs.installer }}.sig
          if-no-files-found: error
          retention-days: 30

      # Notes : la section de la version dans CHANGELOG.md (aussi affichée dans l'app).
      - name: Publier la GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: src-tauri/target/release/bundle/nsis/${{ steps.version.outputs.installer }}
        run: |
          sed -n "/^## ${VERSION//./\\.} /,/^## /{/^## /!p}" CHANGELOG.md > release-notes.md
          test -s release-notes.md
          python -I -c "
          import json, sys, datetime
          version, exe, notes, repo, out = sys.argv[1:6]
          json.dump({
            'version': version,
            'notes': open(notes, encoding='utf-8').read().strip(),
            'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
            'platforms': {'windows-x86_64': {
              'signature': open(exe + '.sig', encoding='utf-8').read().strip(),
              'url': f'https://github.com/{repo}/releases/download/v{version}/' + exe.split('/')[-1],
            }},
          }, open(out, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          " "$VERSION" "$INSTALLER" release-notes.md "$GITHUB_REPOSITORY" latest.json
          printf '\n---\n[Code signing policy](https://github.com/%s#code-signing-policy)\n' "$GITHUB_REPOSITORY" >> release-notes.md
          gh release create "v$VERSION" "$INSTALLER" latest.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "SealedScribe $VERSION" --notes-file release-notes.md
